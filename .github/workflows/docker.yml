name: docker

# 镜像只在 main 合并后构建并推送，PR 阶段的验证由 ci.yml 负责。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 每次构建打两个 tag：提交短 SHA（可追溯到具体代码）与 latest（当前 main）
      - name: Compute image tags
        id: meta
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      # Dockerfile 的运行时阶段会在 arm64 下执行 apk，多平台构建需要 QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ledboot/dujiao-next:${{ steps.meta.outputs.sha }}
            ledboot/dujiao-next:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
